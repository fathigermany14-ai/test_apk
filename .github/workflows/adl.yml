name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug & Release)
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK (Direct Install)
      uses: actions/upload-artifact@v4
      with:
        name: Islamic_Matrix-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK (Unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: Islamic_Matrix-release-unsigned-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
